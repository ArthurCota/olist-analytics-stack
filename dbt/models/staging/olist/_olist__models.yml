version: 2

models:
  - name: stg_olist__orders
    description: One row per order, with timestamps cast to local DATETIME.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer of this order (one customer_id per order).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      - name: purchased_at
        description: When the customer placed the order (Brazil local time).
        data_tests:
          - not_null
      - name: purchase_date
        description: Date part of purchased_at. Used to look up the exchange rate.

  - name: stg_olist__customers
    description: One row per customer_id. Use customer_unique_id to identify the same person across orders.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identifies the person. Needed for repeat purchase and cohort analysis.
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: First 5 digits of the zip code, with leading zeros restored.
      - name: customer_state
        description: Two-letter Brazilian state code.

  - name: stg_olist__order_items
    description: One row per item in an order.
    columns:
      - name: order_item_key
        description: Surrogate key (order_id + order_item_number).
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: price_brl
        description: Item price in BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: freight_value_brl
        description: Freight charged for this item in BRL.

  - name: stg_olist__order_payments
    description: One row per payment method used in an order.
    columns:
      - name: payment_key
        description: Surrogate key (order_id + payment_sequential).
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value_brl
        description: Amount paid with this method in BRL.

  - name: stg_olist__order_reviews
    description: >
      Customer reviews. review_id is not unique in the source (a few reviews
      cover more than one order), so the grain is review_id + order_id.
    columns:
      - name: review_key
        description: Surrogate key (review_id + order_id).
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        description: 1 (worst) to 5 (best).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__products
    description: One row per product.
    columns:
      - name: product_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: Category in Portuguese. Null for 610 products.

  - name: stg_olist__product_category_translation
    description: Portuguese to English category names. Two categories have no translation in the source.
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        data_tests:
          - not_null

  - name: stg_olist__sellers
    description: One row per seller.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: seller_state
        description: Two-letter Brazilian state code.

  - name: stg_olist__geolocation
    description: >
      One row per zip code prefix: average coordinates and the most common
      city and state. Coordinates outside Brazil are discarded.
    columns:
      - name: zip_code_prefix
        description: Primary key, 5 digits with leading zeros.
        data_tests:
          - unique
          - not_null
